<section class="hero wrap">
  <span class="eyebrow">Música</span>
  <h1>música para partitura</h1>
  <p class="lead">Envie uma música ou melodia curta. As teclas mostram as notas. É o teclado do piano, não uma partitura em papel.</p>
  <div
    class="card notes-panel"
    id="notes-panel"
    data-msg-busy="A ler notas…"
    data-msg-empty="Escolha primeiro um ficheiro de áudio."
    data-msg-fail="Não foi possível ler notas deste áudio."
    data-msg-big="O ficheiro tem mais de 15 MB."
    data-msg-offline="O serviço de notas está indisponível agora."
  >
    <div class="field">
      <label for="audio-file">Ficheiro de áudio (wav, mp3, m4a…)</label>
      <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.aac">
    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">Obter notas</button>
      <button type="button" class="btn primary" id="btn-play" disabled>Reproduzir</button>
    </div>
    <p class="notes-status" id="notes-status" hidden></p>
    <div class="notes-kb-wrap"><svg id="notes-kb" aria-label="Teclado de piano"></svg></div>
  </div>
