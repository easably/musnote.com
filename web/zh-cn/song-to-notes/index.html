  <nav class="variants"><a data-page="home" href="/zh-cn/">首页</a><a data-page="song" href="/zh-cn/song-to-notes/">音频转谱</a><a data-page="patterns" href="/chords/patterns/">Patterns</a><a data-page="voice" href="/tools/">语音</a></nav>

<section class="hero wrap">
  <span class="eyebrow">转谱</span>
  <h1>音频转谱</h1>
  <p class="lead">上传歌曲或短旋律。琴键会显示音符。这是钢琴键盘，不是纸面五线谱。</p>
  <div
    class="card notes-panel"
    id="notes-panel"
    data-msg-busy="正在读取音符…"
    data-msg-empty="请先选择音频文件。"
    data-msg-fail="无法从此音频读取音符。"
    data-msg-big="文件大于 15 MB。"
    data-msg-offline="扒谱服务暂时不可用。"
  >
    <div class="field">
      <label for="audio-file">音频文件（wav、mp3、m4a…）</label>
      <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.aac">
    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">获取音符</button>
      <button type="button" class="btn primary" id="btn-play" disabled>播放</button>
    </div>
    <p class="notes-status" id="notes-status" hidden></p>
    <div class="notes-kb-wrap"><svg id="notes-kb" aria-label="钢琴键盘"></svg></div>
  </div>
  <p class="hub-note"><a href="/zh-cn/">← 扒谱</a></p>
</section>
