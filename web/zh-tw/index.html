<section class="hero wrap">
  <span class="eyebrow">扒譜</span>
  <h1>扒譜</h1>
  <p class="lead">上傳一小段獨奏——鋼琴、吉他或清楚的旋律。琴鍵會亮起。按下播放。這是琴鍵上的音，不是五線譜紙張。</p>
  <div
    class="card notes-panel"
    id="notes-panel"
    data-msg-busy="正在讀取音符…"
    data-msg-empty="請先選擇音訊檔。"
    data-msg-fail="無法從此音訊讀取音符。"
    data-msg-big="檔案超過 15 MB。"
    data-msg-offline="扒譜服務目前無法使用。"
  >
    <div class="field">
      <label for="audio-file">音訊檔（wav、mp3、m4a…）</label>
      <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.aac">
    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">取得音符</button>
      <button type="button" class="btn primary" id="btn-play" disabled>播放</button>
    </div>
    <p class="notes-status" id="notes-status" hidden></p>
    <div class="notes-kb-wrap"><svg id="notes-kb" aria-label="鋼琴鍵盤"></svg></div>
  </div>
</section>
