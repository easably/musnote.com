<section class="hero wrap">
  <span class="eyebrow">Song</span>
  <h1>song to piano notes</h1>
  <p class="lead">Upload a song or a short melody. Keys light up. Hit play. Notes on keys, not a printed score.</p>
  <div
    class="card notes-panel"
    id="notes-panel"
    data-msg-busy="Reading notes…"
    data-msg-empty="Choose an audio file first."
    data-msg-fail="Could not read notes from this audio."
    data-msg-big="File is larger than 15 MB."
    data-msg-offline="Note service is unavailable right now."
  >
    <div class="field">
      <label for="audio-file">Audio file (wav, mp3, m4a…)</label>
      <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.aac">
    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">Get notes</button>
      <button type="button" class="btn primary" id="btn-play" disabled>Play</button>
    </div>
    <p class="notes-status" id="notes-status" hidden></p>
    <div class="notes-kb-wrap"><svg id="notes-kb" aria-label="Piano keyboard"></svg></div>
  </div>
  <p class="hub-note"><a href="/">← Audio to piano notes</a></p>
