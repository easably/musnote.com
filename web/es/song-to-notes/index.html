  <span class="eyebrow">Canción</span>
  <h1>canción a notas musicales</h1>
  <p class="lead">Sube una canción o melodía corta. Las teclas muestran las notas. Es el teclado, no una partitura impresa.</p>
  <div
    class="card notes-panel"
    id="notes-panel"
    data-msg-busy="Leyendo notas…"
    data-msg-empty="Elige primero un archivo de audio."
    data-msg-fail="No se pudieron leer notas de este audio."
    data-msg-big="El archivo supera 15 MB."
    data-msg-offline="El servicio de notas no está disponible ahora."
  >
    <div class="field">
      <label for="audio-file">Archivo de audio (wav, mp3, m4a…)</label>
      <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.aac">
    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">Obtener notas</button>
      <button type="button" class="btn primary" id="btn-play" disabled>Reproducir</button>
    </div>
    <p class="notes-status" id="notes-status" hidden></p>
    <div class="notes-kb-wrap"><svg id="notes-kb" aria-label="Teclado de piano"></svg></div>
  </div>
