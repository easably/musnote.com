<section class="hero wrap">
  <span class="eyebrow">Bài hát</span>
  <h1>chuyển bài hát thành nốt nhạc</h1>
  <p class="lead">Tải bài hát hoặc giai điệu ngắn. Phím hiện nốt. Đây là bàn phím piano, không phải tờ khuông nhạc.</p>
  <div
    class="card notes-panel"
    id="notes-panel"
    data-msg-busy="Đang đọc nốt…"
    data-msg-empty="Hãy chọn tệp âm thanh trước."
    data-msg-fail="Không đọc được nốt từ tệp này."
    data-msg-big="Tệp lớn hơn 15 MB."
    data-msg-offline="Dịch vụ nốt hiện không khả dụng."
  >
    <div class="field">
      <label for="audio-file">Tệp âm thanh (wav, mp3, m4a…)</label>
      <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.aac">
    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">Lấy nốt</button>
      <button type="button" class="btn primary" id="btn-play" disabled>Phát</button>
    </div>
    <p class="notes-status" id="notes-status" hidden></p>
    <div class="notes-kb-wrap"><svg id="notes-kb" aria-label="Bàn phím piano"></svg></div>
  </div>
  <p class="hub-note"><a href="/vi/">← Chuyển nhạc thành nốt</a></p>
