<section class="hero wrap">
  <span class="eyebrow">노래</span>
  <h1>노래 악보로 변환</h1>
  <p class="lead">노래나 짧은 멜로디를 업로드하세요. 건반에 음이 나타납니다. 오선지 종이가 아니라 피아노 건반입니다.</p>
  <div
    class="card notes-panel"
    id="notes-panel"
    data-msg-busy="음표를 읽는 중…"
    data-msg-empty="먼저 오디오 파일을 선택하세요."
    data-msg-fail="이 오디오에서 음표를 읽지 못했습니다."
    data-msg-big="파일이 15 MB보다 큽니다."
    data-msg-offline="음표 서비스를 지금 사용할 수 없습니다."
  >
    <div class="field">
      <label for="audio-file">오디오 파일 (wav, mp3, m4a…)</label>
      <input id="audio-file" type="file" accept="audio/*,.mp3,.wav,.m4a,.ogg,.flac,.webm,.aac">
    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">음표 가져오기</button>
      <button type="button" class="btn primary" id="btn-play" disabled>재생</button>
    </div>
    <p class="notes-status" id="notes-status" hidden></p>
    <div class="notes-kb-wrap"><svg id="notes-kb" aria-label="피아노 건반"></svg></div>
  </div>
  <p class="hub-note"><a href="/ko/">← 오디오 악보 변환</a></p>
</section>
