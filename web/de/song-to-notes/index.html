    class="card notes-panel"

    </div>
    <div class="notes-actions">
      <button type="button" class="btn green" id="btn-transcribe">Noten holen</button>
      <button type="button" class="btn primary" id="btn-play" disabled>Abspielen</button>

    <p class="notes-status" id="notes-status" hidden></p>
