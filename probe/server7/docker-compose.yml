name: musnote-separate

services:
  separate:
    build: .
    image: musnote-separate:probe
    restart: unless-stopped
    gpus: all
    ports:
      - "127.0.0.1:8096:8096"
    environment:
      DEMUCS_BIN: demucs
      TORCH_HOME: /var/cache/torch
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      JOB_ROOT: /var/lib/musnote-jobs
    volumes:
      - /home/admin2/.cache/torch:/var/cache/torch
      - musnote-jobs:/var/lib/musnote-jobs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  musnote-jobs:
